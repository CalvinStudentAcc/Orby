<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Orby</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/LoginSignUp.css">
</head>

<body class="auth-page" data-mode="login">

  <a class="auth-home" href="index.html">← Back to Orby</a>

  <div class="stars" aria-hidden="true"></div>

  <!-- Orbit backdrop: spins slowly, jumps when you switch mode -->
  <div class="orbit-scene" id="scene" aria-hidden="true">
    <div class="orbit-spin">
      <div class="ring ring--1" style="--t:60s">
        <span class="planet planet--notes"><i>✎</i></span>
      </div>
      <div class="ring ring--2" style="--t:90s">
        <span class="planet planet--tasks"><i>✓</i></span>
        <span class="planet planet--time planet--b"><i>◷</i></span>
      </div>
      <div class="ring ring--3" style="--t:140s">
        <span class="planet planet--budget"><i>$</i></span>
      </div>
    </div>
  </div>
  <div class="shockwave" id="shockwave" aria-hidden="true"></div>

  <main class="auth-card" id="card">

    <img class="auth-logo" src="assets/images/OrbyIconFinal.png" alt="Orby">

    <div class="tabs" role="tablist" aria-label="Account">
      <button type="button" role="tab" id="tab-login" aria-controls="pane-login" aria-selected="true" data-mode-target="login">Login</button>
      <button type="button" role="tab" id="tab-signup" aria-controls="pane-signup" aria-selected="false" data-mode-target="signup">Sign Up</button>
    </div>

    <div class="panes">

      <!-- LOGIN -->
      <section class="pane" id="pane-login" role="tabpanel" aria-labelledby="tab-login">
        <div class="pane__inner">
          <h1>Welcome back.</h1>
          <p class="sub">Re-enter your orbit.</p>

          <form data-form="login" novalidate>
            <label class="field">
              <input type="text" name="identity" placeholder=" " autocomplete="username" required>
              <span>Username or email</span>
            </label>

            <label class="field">
              <input type="password" name="password" placeholder=" " autocomplete="current-password" required>
              <span>Password</span>
              <button type="button" class="peek" aria-label="Show password">Show</button>
            </label>

            <p class="form-note" role="status"></p>
            <button class="btn-auth" type="submit"><span>Login</span><b aria-hidden="true">→</b></button>
          </form>

          <p class="switch">New here? <button type="button" data-mode-target="signup">Create an account</button></p>
        </div>
      </section>

      <!-- SIGN UP -->
      <section class="pane" id="pane-signup" role="tabpanel" aria-labelledby="tab-signup">
        <div class="pane__inner">
          <h1>Join the orbit.</h1>
          <p class="sub">Create your Orby workspace.</p>

          <form data-form="signup" novalidate>
            <label class="field">
              <input type="text" name="username" placeholder=" " autocomplete="username" required>
              <span>Username</span>
            </label>

            <label class="field">
              <input type="email" name="email" placeholder=" " autocomplete="email" required>
              <span>Email</span>
            </label>

            <label class="field">
              <input type="password" name="password" placeholder=" " autocomplete="new-password" required>
              <span>Password</span>
              <button type="button" class="peek" aria-label="Show password">Show</button>
            </label>

            <label class="field">
              <input type="password" name="confirm" placeholder=" " autocomplete="new-password" required>
              <span>Confirm password</span>
              <button type="button" class="peek" aria-label="Show password">Show</button>
            </label>

            <p class="form-note" role="status"></p>
            <button class="btn-auth" type="submit"><span>Create account</span><b aria-hidden="true">→</b></button>
          </form>

          <p class="switch">Already have an account? <button type="button" data-mode-target="login">Login</button></p>
        </div>
      </section>

    </div>
  </main>

  <script src="assets/js/LoginSignUp.js"></script>
</body>
</html>
